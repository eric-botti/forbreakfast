# Controls when the workflow will run
on:
  # Triggers the workflow on push events but only for the main branch
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/build-and-push-backend.yaml'

env:
  REGISTRY: "registry.digitalocean.com/forbreakfast"
  FRONTEND_IMAGE_NAME: "frontend"
  BACKEND_IMAGE_NAME: "backend"

jobs:
  build_and_push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repo
        uses: actions/checkout@v2

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Log in to DigitalOcean Container Registry with short-lived credentials
        run: doctl registry login --expiry-seconds 720

      - name: Build and push Frontend
        run: docker buildx build --push --tag $(echo $REGISTRY)/$(echo $FRONTEND_IMAGE_NAME):latest frontend

      - name: Build and push Backend
        run: docker buildx build --push --tag $(echo $REGISTRY)/$(echo $BACKEND_IMAGE_NAME):latest backend