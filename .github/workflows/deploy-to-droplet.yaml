name: Build and Deploy to DigitalOcean Droplet


# Controls when the workflow will run
on:
  # Triggers the workflow on push events but only for the main branch
  push:
    branches: [main]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

env:
  REGISTRY: "registry.digitalocean.com/forbreakfast"
  FRONTEND_IMAGE_NAME: "frontend"
  BACKEND_IMAGE_NAME: "backend"


jobs:
  build_and_push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repo
        uses: actions/checkout@v2

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Log in to DigitalOcean Container Registry with short-lived credentials
        run: doctl registry login --expiry-seconds 720

      - name: Build and push Frontend
        run: docker buildx build --push --tag $(echo $REGISTRY)/$(echo $FRONTEND_IMAGE_NAME):latest frontend

      - name: Build and push Backend
        run: docker buildx build --push --tag $(echo $REGISTRY)/$(echo $BACKEND_IMAGE_NAME):latest backend

  deploy:
    runs-on: ubuntu-latest
    needs: build_and_push

    steps:
      - name: Deploy to Digital Ocean droplet via SSH action
        uses: appleboy/ssh-action@v0.1.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
          envs: IMAGE_NAME,REGISTRY, {{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}, {{ secrets.OPENAI_API_KEY }}
          script: |
            # Login to Registry Using doctl
            doctl auth init -t ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
            doctl registry login --expiry-seconds 720
            
            # Pull the latest images
            docker pull registry.digitalocean.com/forbreakfast/frontend:latest
            docker pull registry.digitalocean.com/forbreakfast/backend:latest

            # Stop and remove all current containers
            docker stop $(docker ps -q) || true
            docker rm $(docker ps -a -q) || true

            # Go into the directory
            cd forbreakfast

            # Get the latest changes
            git pull

            # Run new containers from docker-compose
            docker-compose up -d
