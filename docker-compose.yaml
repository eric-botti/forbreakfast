version: '3.7'

networks:
  caddy:

services:
  frontend:
    image: registry.digitalocean.com/forbreakfast/frontend:latest
    container_name: frontend
    restart: always
    ports:
      - "5231:5231" # Expose the frontend port
    networks:
      - caddy

  backend:
    image: registry.digitalocean.com/forbreakfast/backend:latest
    container_name: backend
    restart: always
    networks:
      - caddy

  caddy:
    image: caddy:latest
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - caddy

volumes:
  caddy_data:
  caddy_config:
