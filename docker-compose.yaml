version: "3" # Specifies the version of Docker Compose syntax.

services:
  web:
    image: registry.digitalocean.com/forbreakfast/forbreakfast:latest
    container_name: web # Name of the container for the web service.
    ports:
      - "5231:5231" # Maps port 80 on the host to port 80 on the container.
      - "5230:5230"
    networks:
      - webnet # Specifies that this service is connected to the 'webnet' network.

  nginx:
    image: nginx:latest # Uses the latest official Nginx image from Docker Hub.
    container_name: nginx # Name of the container for the Nginx service.
    ports:
      - "80:80" # Maps port 80 on the host to port 80 on the container for HTTP traffic.
      - "443:443" # Maps port 443 on the host to port 443 on the container for HTTPS traffic.
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf # Mounts the Nginx configuration file from the host.
      - ./certbot/conf:/etc/letsencrypt # Mounts the directory for Let's Encrypt certificates.
      - ./certbot/www:/var/www/certbot # Mounts the directory used for the ACME challenge.
    depends_on:
      - web # Ensures that the 'web' service is started before this service.
    networks:
      - webnet # Specifies that this service is connected to the 'webnet' network.

  certbot:
    image: certbot/certbot # Uses the official Certbot image from Docker Hub.
    container_name: certbot # Name of the container for the Certbot service.
    volumes:
      - ./certbot/conf:/etc/letsencrypt # Mounts the directory for Let's Encrypt certificates.
      - ./certbot/www:/var/www/certbot # Mounts the directory used for the ACME challenge.
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do sleep 6h & wait $${!}; certbot renew; done;'"
    # Sets up a loop to renew certificates every 6 hours.
    networks:
      - webnet # Specifies that this service is connected to the 'webnet' network.

networks:
  webnet: # Defines the 'webnet' network for the services to communicate.
