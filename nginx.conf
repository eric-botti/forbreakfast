# Configuration for HTTP traffic
server {
    listen 80;  # Listen on port 80 for HTTP traffic
    server_name aiforbreakfast.com;  # Replace with your domain name

    # Location block to handle ACME challenge for Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;  # Serve the ACME challenge from this directory
    }

    # Redirect all other HTTP requests to HTTPS
    location / {
        return 301 https://$host$request_uri;  # Redirect to the same URL but with HTTPS
    }
}

# Configuration for HTTPS traffic
server {
    listen 443 ssl;  # Listen on port 443 for HTTPS traffic
    server_name aiforbreakfast.com;  # Replace with your domain name

    # SSL certificate and key files
    ssl_certificate /etc/letsencrypt/live/your-domain.com/fullchain.pem;  # Path to the SSL certificate
    ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;  # Path to the SSL certificate key

    # Location block to proxy requests to the web service
    location / {
        proxy_pass http://web:5231;  # Proxy requests to the web service running on port 80
        proxy_set_header Host $host;  # Forward the Host header from the client
        proxy_set_header X-Real-IP $remote_addr;  # Forward the real IP address of the client
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;  # Forward the list of proxy addresses
        proxy_set_header X-Forwarded-Proto $scheme;  # Forward the protocol (HTTP or HTTPS)
    }
}
